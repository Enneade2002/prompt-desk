name: Android-APK und Windows-EXE bauen

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-apk:
    name: Android-APK
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Java einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: PWA-Dateien vorbereiten
        run: npm run prepare:web

      - name: Android-Projekt erzeugen und synchronisieren
        run: |
          npx cap add android
          npx cap sync android

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK als Artefakt bereitstellen
        uses: actions/upload-artifact@v7
        with:
          name: prompt-desk-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows-exe:
    name: Windows-EXE
    runs-on: windows-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Windows-Installer bauen
        run: npm run electron:build:windows

      - name: EXE als Artefakt bereitstellen
        uses: actions/upload-artifact@v7
        with:
          name: prompt-desk-windows-exe
          path: release/*.exe
          if-no-files-found: error
